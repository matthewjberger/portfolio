[workspace]
members = ["protocol", "worker"]
resolver = "2"

[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
wasm-bindgen = "=0.2.115"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "CssStyleDeclaration",
    "DomRect",
    "DomRectReadOnly",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "MessageEvent",
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
    "PointerEvent",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "Gamepad",
    "GamepadButton",
    "Navigator",
    "Node",
    "NodeList",
    "DomTokenList",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "MediaQueryList",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Performance",
    "Storage",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
