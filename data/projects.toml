[[items]]
title = "nightshade 🦀"
language = "rust"
description = "Data-oriented Rust game engine featuring custom render graph, built-in editor, rapier3d physics, kira audio, gltf asset loading, scene graph, object picking, and Steam integration. Runs natively on DX12/Metal/Vulkan and in-browser via WebGPU."
link = "https://github.com/matthewjberger/nightshade"
technologies = ["Rust", "wgpu", "ECS", "WebGPU"]

[[items]]
title = "freecs 🦀"
language = "rust"
description = "Archetype-based ECS in Rust with zero unsafe code, Rayon-parallel system execution, sparse-set tags, deferred command buffers, and watermark change detection. The entire ECS is generated at compile time via a declarative macro. 48k+ downloads on crates.io."
link = "https://github.com/matthewjberger/freecs"
technologies = ["Rust", "ECS", "Macros", "Rayon"]

